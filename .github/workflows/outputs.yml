name: 12-using-outputs
on: [workflow_dispatch]
jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - id: step1
        run: echo "NAME:Virat" >> "$GITHUB_OUTPUT"

  goodbye:
    runs-on: ubuntu-latest
    needs: [welcome]
    steps:
      - run: echo "Bye, ${{ needs.welcome.output.name }}"
