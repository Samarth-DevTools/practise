name: Using_cache
on: workflow_dispatch
jobs:
  step-1:
   runs-on: ubutu-latest
   steps:
     - uses: actions/cache@v3
       id: cache
       with:
         path: node_modules
         key: ${{ hashFiles('**/package-lock.json') }}
     - name: Install deps
       if: steps.cache.outputs.cache-hit != 'true'
       run: npm ci
         
     - name: Lint & test
       run: |
         npm run lint
         npm run test
  
