name: exploring contexts
run-name: exploring contexts | DEBUG - ${{ inputs.debug }}

on: 
  push:
  workflow_dispatch:
    inputs: 
       debug:
         type: string
         default: false
env: 
  MY_WF_VAR: 'workflow'
  MY_OVERWRITTEN_VAR: 'workflow'

jobs:
  echo-data:
    runs-on: ubuntu-latest
    env:
      MY_JOB_VAR: 'job'
      MY_OVERWRITTEN_VAR: 'job'
    steps: 
      - name: Display info
        run: |
          echo "Actor: ${{ github.actor }}"
          echo "Event-name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "run-id: ${{ github.run_id }}"
          
      - name: Retreive var
        run: |
          echo "Varible value: ${{ vars.MY_VAR }}"
          
      - name: Print env var
        env: 
          MY_OVERWRITTEN_VAR: 'step'
        run: |
          echo "Workflow env: ${{ env.MY_WF_VAR }}"
          echo " Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
          
      - name: Print env var
        run: |
          echo "Workflow env: ${{ env.MY_WF_VAR }}"
          echo " Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"

  echo-data-2:
    runs-on: ubuntu-latest
    steps:
      - name: Print env var
        run: |
          echo "Workflow env: $env.MY_WORKFLOW_VAR"
          echo "Overwritten env: $env.MY_OVERWRITTEN_VAR"
