name: using-artifacts
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: npm install & build webpack
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4.6.2
        with: 
          name: webpack artifacts
          path: public/
          
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@v4.3.0
        with:
          name: webpack artifacts
          path: public
        
