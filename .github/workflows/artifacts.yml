name: using-artifacts
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: npm install & build webpack
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifacts@main
        with: 
          name: webpack artifacts
          path: public/
          
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/download-artifact@main
        with:
          name: webpack artifacts
          path: public
        
