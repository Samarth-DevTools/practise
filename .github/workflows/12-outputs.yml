name: working with outputs
on: 
  workflow_dispatch:
    inputs:
      build-status:
        type: choice
        options:
          - success
          -  failure
        default: success
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outputs.status }}
      output1: ${{ steps.build.outputs.output1 }}
      output2: ${{ steps.build.outputs.output2 }}
      
    steps:
      - name: print github_output
        run: echo "$GITHUB_OUTPUT"
        
      - name: build
        id: build
        run: |
          echo "GITHUB_OUTPUT"
          echo "status= ${{ inputs.build-status == 'success' }}" >> "$GITHUB_OUTPUT"
          echo "output1= value1" >> "$GITHUB_OUTPUT" 
          echo "output1= value2" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          
      - name: step with mistake
        run: |
          echo "mistake=true" > "$GITHUB_OUTPUT"
          cat  $GITHUB_OUTPUT
          
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: Deploy
        run: echo "Deploying"
      - name: Print outputs
        run: echo "${{ needs.build.outputs.output1 }}"
          
